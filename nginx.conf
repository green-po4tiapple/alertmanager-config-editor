server {
    # IPv4 only, on purpose. Adding `listen [::]:8080` looks harmless but crashes
    # nginx at startup on any node whose kernel has IPv6 disabled
    # (97: Address family not supported by protocol), which is common in cloud
    # Kubernetes. If your nodes do have IPv6, add the line back.
    #
    # With readOnlyRootFilesystem the image entrypoint logs that it could not patch
    # in an IPv6 listener. That message is informational and expected.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No client-side router here, but unknown paths still return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Scripts, styles and images come from this origin only: no third-party script
    # can be pulled in.
    #
    # connect-src is deliberately wider: the batch check asks a Prometheus /
    # VictoriaMetrics instance — at an address the user types in — for series
    # labels. Only rule expressions go out that way, never the routing tree or the
    # pasted config. If you do not need that, set connect-src back to 'self': the
    # application keeps working, just without enrichment.
    #
    # The production build also carries the same policy as a <meta> tag, for static
    # hosts that cannot set headers.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~* \.(js|css|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
